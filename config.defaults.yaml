# GScrape complete CLI defaults. YAML 1.2 compatible; values mirror argparse defaults.
query: null
category: all
categories: null
domain: null
category_regex: ""
attachment_extensions: ""
attachment_filename_regex: ""
attachment_discovery: false
acquire_attachments: false
attachment_output_dir: acquired-attachments
capture_mode: metadata-only
secure_artifact_backend: null
after: ""
before: ""
no_date_filter: false
retries: 4
requests_per_second: 1.0
rate_limit_max_delay: 60.0
user: me
profile_index: "0"
max_messages: 1000
log_file: email-wallet-search.log
run_id: ""
progress_file: null
verbose: false
env_file: .env
authorize: false
oauth_port: 8765
redirect_uri: null
report: false
export_csv: null
export_json: null
report_only: false
profile_check: false
list_labels: false
suggest_queries: null
sort_findings: relevance
promotional_suppression: true
promotional_suppression_threshold: 0
secret_evidence:
  enabled: true
  capture_mode: metadata-only
  encrypted_output_dir: protected-artifacts
  allow_local_review: true
llm:
  enabled: false
  provider: openai-compatible
  api_base: https://api.openai.com/v1
  model: gpt-5.6-luna
  api_key_env: OPENAI_API_KEY
  include_secret_values: false
  output_dir: llm-reports
raw_export:
  database: raw-mailbox/raw-mailbox.db
  blob_dir: raw-mailbox/blobs
  include_attachments: false